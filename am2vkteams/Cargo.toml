[package]
name = "am2vkteams"
version = "0.1.0"
edition = "2021"
description = "Bridge between Prometheus Alertmanager and VK Teams Bot API"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
